[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fudosan-library"
version = "0.1.0"
description = "Python SDK for the MLIT Real Estate Information Library API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Hideyuki", email = "hideyuki@example.com" }
]
keywords = ["mlit", "real-estate", "sdk", "api-client", "geojson"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
geo = [
  "geopandas>=0.14.0",
  "mapclassify>=2.6.0",
  "pyogrio>=0.7.2",
  "pyproj>=3.6.0",
  "shapely>=2.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pytest-recording>=0.13.1",
  "respx>=0.21.0",
  "ruff>=0.4.0",
  "mypy>=1.8.0",
  "jupyterlab>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/hideyuki/fudosan-library"
Repository = "https://github.com/hideyuki/fudosan-library"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["fudosan_library*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
select = ["E", "F", "I", "B", "W"]

[tool.mypy]
python_version = "3.10"
plugins = []
strict = true
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["fudosan_library"]
